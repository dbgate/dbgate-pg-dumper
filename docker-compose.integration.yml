services:
  postgres-9-6:
    image: postgres:9.6
    environment:
      POSTGRES_DB: dumper_test
      POSTGRES_USER: dumper
      POSTGRES_PASSWORD: dumper
    ports:
      - '55496:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dumper -d dumper_test']
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-13:
    image: postgres:13
    environment:
      POSTGRES_DB: dumper_test
      POSTGRES_USER: dumper
      POSTGRES_PASSWORD: dumper
    ports:
      - '55113:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dumper -d dumper_test']
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-18:
    image: postgres:18
    environment:
      POSTGRES_DB: dumper_test
      POSTGRES_USER: dumper
      POSTGRES_PASSWORD: dumper
    ports:
      - '55118:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dumper -d dumper_test']
      interval: 2s
      timeout: 3s
      retries: 30
